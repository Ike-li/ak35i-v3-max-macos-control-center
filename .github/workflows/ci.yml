name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Swift tools 6.0 requires Xcode 16 or newer. macos-14 currently defaults
    # to Xcode 15.4, while macos-15 provides a Swift 6 toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test --disable-sandbox
