name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version ${version}"
            exit 1
          fi
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Build the universal DMG
        run: zsh Packaging/create-dmg.sh
      - name: Check the packaged app starts
        run: '"dist/AK35i Control Center.app/Contents/MacOS/ak35i" --help'
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/AK35i-Control-Center-*-universal.dmg \
            dist/AK35i-Control-Center-*-universal.dmg.sha256 \
            --draft --title "${GITHUB_REF_NAME}" --generate-notes
